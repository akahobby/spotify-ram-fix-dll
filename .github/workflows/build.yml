name: Build Spotify RAM Fix DLL v0.9
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload DLL and config
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyRamFix-v0.9-x64
          path: |
            build/Release/version.dll
            settings.ini
