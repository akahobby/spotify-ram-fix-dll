name: Build Spotify RAM Fix v1.0

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/Release/version.dll')) {
            throw 'Expected DLL was not built.'
          }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item 'build/Release/version.dll' 'release/version.dll'
          Copy-Item 'settings.ini', 'install.ps1', 'uninstall.ps1', 'README.md', 'LICENSE' -Destination release
          Compress-Archive -Path 'release/*' -DestinationPath 'SpotifyRamFix-v1.0-Windows-x64.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyRamFix-v1.0-Windows-x64
          path: SpotifyRamFix-v1.0-Windows-x64.zip
          if-no-files-found: error
