[Settings]
EnableTrim=1
TrimIntervalMs=30000

; 0 retains v0.9.1 behavior: trim regardless of current working set.
; A value such as 100 limits trimming to processes above 100 MiB.
MinWorkingSetMB=0

; Delay initial trim while Spotify starts.
StartupDelayMs=5000

; 0 reduces OutputDebugString overhead; 1 enables detailed diagnostics.
EnableDebugLogging=0

; Experimental: cross-process attempts require sufficient Windows permissions.
EnableCrossProcessTrim=1
